name: Verify orientation demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s verification -v
      - run: python verification/check_publication.py
      - run: python -m switch_orientation_demo --replay --no-gui --show-direction --output outputs/ci
